name: scholarmind

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
    container_name: scholarmind-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "9200:9200"

  backend:
    build:
      context: ./backend
    container_name: scholarmind-backend
    env_file:
      - ./backend/.env
    environment:
      ES_URL: http://elasticsearch:9200
    ports:
      - "8002:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: scholarmind-frontend
    ports:
      - "5175:80"
    depends_on:
      - backend

volumes:
  scholarmind-es-data:
